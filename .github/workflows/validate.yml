name: Validate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, 'feat/**', 'fix/**', 'refactor/**', 'test/**', 'docs/**', 'chore/**']
permissions:
  contents: read
jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: node scripts/release/check-commits.mjs "$BASE_SHA" "$HEAD_SHA"
      - run: npm test
      - run: npm run lint
      - run: npm run build
